       (headless Chrome, 1200 by 630), in the style of the site's card. -->

  <!-- Bench version: the ?v= on every script and stylesheet below. Raise it by
       0.0.1 on every push that changes research/ (unless told otherwise), all
       tags alike, so browsers fetch fresh copies. The page shows
       it beside the title (kit/base.js reads it from its own tag). Set bench-date
       below to the day of the release; the About box (kit/about.js) shows both. -->
  <meta name="bench-date" content="2026-10-11">
  <link rel="icon" href="img/tape-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="kit/bench.css?v=1.18.85">
  <link rel="stylesheet" href="css/research.css?v=1.18.85">

  <link rel="stylesheet" href="kit/kit.css?v=1.18.85">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" title="Spacewar! Research Bench">
      <img src="img/tape-icon.svg" alt="" width="26" height="26">
      <span class="brand-name">Spacewar!<b>research bench</b></span>
      <span class="bench-ver" id="bench-ver"></span>
    </a>
    <label class="pick">
      <span>Version</span>
      <select id="pick-a" aria-label="Version"></select>
      <span class="swref" id="vref" title="The bench’s reference to this source (Help ▸ Referencing and versions)"></span>
      <a class="vlang" id="vlang" href="https://bitsavers.org/pdf/dec/pdp1/PDP-1_Macro.pdf" target="_blank" rel="noopener noreferrer"></a>
    </label>
    <div class="tape-strip" id="tape-strip" title="The assembled paper tape for this version"></div>
    <div class="bar-right">
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <span class="size-btns"><button class="icon-btn" id="btn-smaller" title="Smaller code text">A−</button><button class="icon-btn" id="btn-larger" title="Larger code text">A+</button></span>
      <button class="icon-btn" id="btn-theme" title="Switch between your last light and dark colour themes (choose themes in ⚙ Settings)">◐</button>
      <button class="icon-btn" id="btn-share" title="Share what you are looking at: a link to this view">⇪</button>
      <button class="icon-btn" id="btn-code" title="Go to a code: an annotation (A-, R-), a finding (C-, F), a note (initials-N)">#</button>
      <button class="icon-btn news-btn" id="btn-news" title="What’s new in the group’s annotations">✉<span class="news-n" id="news-n"></span></button>
      <!-- About is in the Help menu; this hidden button carries its handler -->
      <button class="icon-btn" id="btn-about" hidden>ⓘ</button>
      <button class="icon-btn" id="btn-settings" title="Your initials and the Hypothesis group, colour theme, code font and size">⚙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-tab="read" class="on">Read</button>
    <button data-tab="run">Run</button>
    <button data-menu="text" data-tabs="analyse" data-lenses="1 2 3 14" aria-expanded="false" title="The source as text: comments, hands and dates, names">Text <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="program" data-tabs="analyse" data-lenses="15 4 5 6 8 9 10 11" aria-expanded="false" title="The program and the machine: calls, instructions, macros, timing, memory">Program <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="graphics" data-tabs="graphics" aria-expanded="false" title="The star map and the scope, the ships, the sun, hyperspace">Graphics <span class="caret" aria-hidden="true">▾</span></button>
    <button data-menu="versions" data-tabs="about compare genealogy tape analyse" data-lenses="7" aria-expanded="false" title="The version open, comparison, genealogy, the tapes, gaps in the record">Versions <span class="caret" aria-hidden="true">▾</span></button>
    <button data-tab="findings" title="What the bench and the group have established, with evidence; shared">Findings</button>
    <button data-tab="notes" title="What you have gathered for writing: figures, excerpts, findings, paragraphs; private, in this browser">My notes</button>
    <button data-tab="paratexts" title="The scans, clippings, photographs and documents around the program, shared with the crew">Paratexts</button>
    <button data-menu="help" aria-expanded="false" title="About the bench, settings, the code">Help <span class="caret" aria-hidden="true">▾</span></button>
    <a class="tabs-map" href="sitemap.html" title="Every view and version as a plain link, for when a menu will not open">Site map</a>
  </nav>
  <noscript><div class="noscript">The research bench runs in JavaScript, which is turned off in this browser. The <a href="sitemap.html">site map</a> lists every version with its source files, which open on GitHub without it.</div></noscript>

  <main id="main">
    <section class="view on" id="view-read"></section>
    <section class="view" id="view-run"></section>
    <section class="view" id="view-analyse"></section>
    <section class="view" id="view-compare"></section>
    <section class="view" id="view-genealogy"></section>
    <section class="view" id="view-tape"></section>
    <section class="view" id="view-graphics"></section>
    <section class="view" id="view-about"></section>
    <section class="view" id="view-findings"></section>
    <section class="view" id="view-notes"></section>
    <section class="view" id="view-paratexts"></section>
  </main>

  <aside class="drawer" id="drawer" aria-label="Details">
    <div class="drawer-head">
      <h2 id="drawer-title">Annotations</h2>
      <button class="icon-btn" id="drawer-close" title="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>


  <dialog id="dlg-note" data-keep>
    <form method="dialog" class="settings" id="note-form">
      <h2 id="note-title">Annotate</h2>
      <p class="keep-hint" hidden>Unsaved annotation. Save it, or Cancel to discard it.</p>
      <p class="hint" id="note-anchor"></p>
      <textarea id="note-text" rows="7" placeholder="Your annotation. Markdown is fine."></textarea>
      <label>Tags <input id="note-tags" placeholder="e.g. gravity, labour, provenance" autocomplete="off"></label>
      <label class="check-row dev-check" id="note-dev" hidden><span><input type="checkbox"> Developer only</span></label>
      <p class="hint" id="note-who"></p>
      <div class="row">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="save" class="btn">Save annotation</button>
      </div>
    </form>
  </dialog>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>
